projects:
  - title: "Fly Me To the Moon"
    url: "https://github.com/fr4nsyz/fly-me-to-the-moon"
    media:
      type: image
      src: "/img/fly-me-to-the-moon-sdc.gif"
      alt: "One stuck bit in the flight computer crashes the lunar lander"
    description: >-
      Offline, deterministic platform for studying silent data corruption
      (SDC) in numerical C++ programs, demonstrated on a lunar landing
      computer. <a href="/blog/fly-me-to-the-moon-week-1/">Week 1 writeup</a>
    tags:
      - C++
      - LLVM
      - SDC
